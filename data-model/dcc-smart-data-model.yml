summary: >-
  The published OpenAPI has almost no data model — one reusable schema (Error) and two
  inline request/response objects, each carrying a single Base64 string. The real entities
  live inside the Base64 payload, in DUIS XML and its GBCS payloads, which the spec treats
  as an opaque blob. The entities below that are marked opaque_to_spec are documented in
  first-party sources (the signing tool README, the Node-RED nodes README, the keystore
  README and JSON Schema) rather than derived from the OpenAPI.
