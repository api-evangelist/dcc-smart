harvested_specs:
- path: openapi/dcc-boxed-duis-signing-tool-openapi.yml
  source_url: https://raw.githubusercontent.com/SmartDCCInnovation/dccboxed-signing-tool/main/openapi.yaml
  fetched: '2026-07-27'
  http_status: 200
  format: OpenAPI 3.0.3
  parsed: true
  title: DCC Boxed DUIS Signing Tool API
  version: 1.0.0
  license: GPL-3.0
  operations:
  - POST /sign
  - POST /verify
  server: http://localhost:8080 (local development server — no hosted endpoint published)
  note: |
    Verbatim copy. Published by Smart DCC Limited in its SmartDCCInnovation GitHub
    organisation. This is a self-hosted developer utility for XML digital signature
    operations on DUIS messages, not a hosted Smart DCC production API.

open_source:
  org: https://github.com/SmartDCCInnovation
  repos:
  - name: dccboxed-signing-tool
    description: DCC Boxed DUIS Validation and Signing Tool (Java/Maven; ships openapi.yaml)
  - name: duis-parser
    description: Lightweight bi-directional conversion between DUIS and JSON (TypeScript)
  - name: duis-templates
    description: Collection of DUIS templates in JSON format
  - name: duis-sign-wrap
    description: TypeScript wrapper for dccboxed-signing-tool
  - name: dccboxed-keystore
    description: Certificate and key store for DCC Boxed; client code queries the DCC
      Boxed SMKI certificate search/retrieve service (no public spec published)
  - name: dccboxed-nodered-nodes
    description: Node-RED nodes for sending/receiving DUIS requests to a DCC Boxed instance
  - name: gbcs-parser
    description: GBCS (Great Britain Companion Specification) parser
  note: |
    All published under GPL-3.0. These are client-side tooling for the gated DUIS
    interface and for the paid DCC Boxed test appliance. None of them provides a
    developer with access to live smart metering data.

not_found:
- A self-serve developer portal or API console
- A public REST/JSON API of any kind operated by Smart DCC
- Any consumer usage, billing, tariff, or consent API
- Any open data API, bulk download, or data licence for the network dashboard figures
- Green Button / ESPI, CDR Consumer Data Standards, OCPP, OCPI, OpenADR, IEEE 2030.5,
  or IEC CIM references
- OAuth 2.0, OpenID Connect, or API key issuance of any kind

