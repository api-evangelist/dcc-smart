summary: >-
  Smart DCC runs two very different lifecycles. The open-source DCC Boxed tooling is
  versioned with semantic-version git tags and dated GitHub releases. The production DUIS
  interface is versioned by the Smart Energy Code modification process: a numbered DUIS
  version (v5.3 at the time of review) designated through consultation and delivered in
  scheduled June and November SEC releases, each with a published Testing Approach
  Document consulted on in advance.
