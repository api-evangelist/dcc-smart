  note: >-
    There is no HTTP Deprecation/Sunset (RFC 8594) header contract — DUIS is an XML web
    service on a private gateway and the signing tool is a two-operation local utility.
    Withdrawal of an interface version is a Smart Energy Code modification: changes are
    consulted on, designated with an effective date, and legacy behaviour is retired via
    the code, not via response headers. Example in the public consultation record: the
    proposal to remove the 0x8F75 alert from the Traffic Management Mechanism Document.
