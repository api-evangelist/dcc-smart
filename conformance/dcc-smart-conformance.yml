method: searched
source: https://www.smartdcc.co.uk/media/sn5dn4hr/information-security-policy-3.pdf
summary: >-
  Smart DCC's conformance surface is regulatory and cryptographic, not web-API. The
  published OpenAPI is a two-operation local utility with no security schemes, no OAuth,
  no OIDC and no RFC 9457 problem details. What Smart DCC does conform to — and publishes
  evidence for — is a UK energy-code and information-security regime: the Smart Meter
  Communication Licence, the Smart Energy Code, the Retail Energy Code, ISO/IEC 27001:2022
  certification, and the NIST Cybersecurity Framework 2.0. Message security is W3C XML
  Signature over DUIS payloads using SMKI-issued EC prime256v1 certificates.
