summary: >-
  Smart DCC Limited publishes six first-party open-source client libraries to npm under
  the @smartdcc scope, all developed in the SmartDCCInnovation GitHub organisation and
  all licensed GPL-3.0. They are tooling for the DCC Boxed test environment and the DUIS
  (DCC User Interface Specification) XML message format rather than SDKs for a hosted
  Smart DCC API — Smart DCC operates no self-serve hosted API. The Java DCC Boxed DUIS
  signing and validation tool is NOT published to a package registry; it is built from
  source with Maven (searched Maven Central for group uk.co.smartdcc and for the term
  smartdcc on 2026-07-27 — 0 results).
